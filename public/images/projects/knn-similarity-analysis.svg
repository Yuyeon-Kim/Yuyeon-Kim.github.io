<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">KNN similarity search and error analysis</title>
  <desc id="desc">A confidentiality-safe conceptual view of nearest-neighbor retrieval, error review, and iterative parameter tuning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e7efff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#264783" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="76" y="88" fill="#315efb" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="3">DATA SCIENCE · CONFIDENTIALITY-SAFE VIEW</text>
  <text x="76" y="154" fill="#101828" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">KNN similarity search and error analysis</text>

  <g transform="translate(70 220)" filter="url(#shadow)">
    <rect width="850" height="600" rx="34" fill="#ffffff"/>
    <text x="40" y="58" fill="#52627d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">EMBEDDING SPACE</text>
    <g fill="#a8b8d8" opacity="0.9">
      <circle cx="132" cy="166" r="15"/><circle cx="208" cy="230" r="13"/><circle cx="162" cy="321" r="16"/>
      <circle cx="256" cy="403" r="13"/><circle cx="343" cy="170" r="14"/><circle cx="456" cy="126" r="13"/>
      <circle cx="570" cy="194" r="15"/><circle cx="674" cy="148" r="14"/><circle cx="735" cy="270" r="12"/>
      <circle cx="650" cy="428" r="15"/><circle cx="746" cy="500" r="13"/><circle cx="518" cy="514" r="14"/>
      <circle cx="364" cy="530" r="12"/><circle cx="164" cy="505" r="14"/>
    </g>
    <g stroke="#315efb" stroke-width="4" opacity="0.7">
      <line x1="420" y1="322" x2="354" y2="278"/>
      <line x1="420" y1="322" x2="500" y2="286"/>
      <line x1="420" y1="322" x2="466" y2="406"/>
    </g>
    <circle cx="420" cy="322" r="54" fill="#315efb" fill-opacity="0.1" stroke="#315efb" stroke-width="4" stroke-dasharray="10 10"/>
    <circle cx="420" cy="322" r="20" fill="#0b1220"/>
    <circle cx="354" cy="278" r="17" fill="#12b99a"/>
    <circle cx="500" cy="286" r="17" fill="#12b99a"/>
    <circle cx="466" cy="406" r="17" fill="#12b99a"/>
    <text x="443" y="317" fill="#101828" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Query</text>
    <text x="40" y="556" fill="#52627d" font-family="Arial, Helvetica, sans-serif" font-size="21">Distance-ranked candidates</text>
    <text x="354" y="556" fill="#101828" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Review errors before tuning k</text>
  </g>

  <g transform="translate(970 220)" font-family="Arial, Helvetica, sans-serif">
    <rect width="560" height="600" rx="34" fill="#0b1220"/>
    <text x="38" y="58" fill="#8facff" font-size="22" font-weight="700">DECISION FRAMEWORK</text>
    <g transform="translate(38 98)">
      <rect width="484" height="100" rx="20" fill="#142748"/>
      <circle cx="54" cy="50" r="25" fill="#315efb"/>
      <text x="47" y="58" fill="#ffffff" font-size="22" font-weight="700">1</text>
      <text x="98" y="42" fill="#ffffff" font-size="24" font-weight="700">Retrieval quality</text>
      <text x="98" y="72" fill="#aabbd9" font-size="19">Neighbor relevance and ranking</text>
    </g>
    <g transform="translate(38 220)">
      <rect width="484" height="100" rx="20" fill="#142748"/>
      <circle cx="54" cy="50" r="25" fill="#e55e78"/>
      <text x="47" y="58" fill="#ffffff" font-size="22" font-weight="700">2</text>
      <text x="98" y="42" fill="#ffffff" font-size="24" font-weight="700">Error taxonomy</text>
      <text x="98" y="72" fill="#aabbd9" font-size="19">False positives and missed cases</text>
    </g>
    <g transform="translate(38 342)">
      <rect width="484" height="100" rx="20" fill="#142748"/>
      <circle cx="54" cy="50" r="25" fill="#12b99a"/>
      <text x="47" y="58" fill="#ffffff" font-size="22" font-weight="700">3</text>
      <text x="98" y="42" fill="#ffffff" font-size="24" font-weight="700">Parameter tuning</text>
      <text x="98" y="72" fill="#aabbd9" font-size="19">Compare settings on reviewed cases</text>
    </g>
    <rect x="38" y="490" width="484" height="72" rx="18" fill="#315efb"/>
    <text x="92" y="536" fill="#ffffff" font-size="23" font-weight="700">Retrieve · Review · Tune in a repeatable loop</text>
  </g>
</svg>
